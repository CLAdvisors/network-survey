name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  api-smoke:
    name: API integration smoke test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ONA
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Run Liquibase migrations
        # changeLogFile keeps the "changelogs/" prefix so changeset identities
        # match how migrations run everywhere else (from db/)
        run: |
          docker run --rm --network host \
            -v "$PWD/db:/db" \
            liquibase/liquibase:4.29 \
            --url=jdbc:postgresql://127.0.0.1:5432/ONA \
            --username=postgres \
            --password=postgres \
            --changeLogFile=changelogs/master-changelog.xml \
            --searchPath=/db \
            update

      - name: Rehearse abandoned PR27 staging reconciliation and no-history safety
        run: |
          LEGACY='For each question below, indicate the people you interact with at work. The survey will take 10-15 minutes to complete; please plan to finish in one session.'
          for DATABASE in ONA_pr27 ONA_no_pr27_history; do
            PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres -T ONA "$DATABASE"
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d "$DATABASE" -v ON_ERROR_STOP=1 \
              -c "DELETE FROM databasechangelog WHERE id='editable-survey-instructions-reconciliation-1' AND author='network-survey'" \
              -c "ALTER TABLE survey ALTER COLUMN instructions SET DEFAULT '$LEGACY'" \
              -c "INSERT INTO survey(name,title,creation_date,organization_id,instructions) SELECT 'PR27Legacy','Legacy',now(),id,'$LEGACY' FROM organizations WHERE slug='default-imported'" \
              -c "INSERT INTO survey(name,title,creation_date,organization_id,instructions) SELECT 'PR27Hidden','Hidden',now(),id,'' FROM organizations WHERE slug='default-imported'" \
              -c "INSERT INTO survey(name,title,creation_date,organization_id,instructions) SELECT 'PR27Custom','Custom',now(),id,'Preserve this administrator value' FROM organizations WHERE slug='default-imported'"
          done
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d ONA_pr27 -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO databasechangelog(id,author,filename,dateexecuted,orderexecuted,exectype)
          SELECT 'editable-survey-content-1','cladvisors','changelogs/v1_5_editable_survey_content.sql',now(),COALESCE(max(orderexecuted),0)+1,'EXECUTED'
          FROM databasechangelog;
          SQL
          for DATABASE in ONA_pr27 ONA_no_pr27_history; do
            docker run --rm --network host -v "$PWD/db:/db" liquibase/liquibase:4.29 \
              --url="jdbc:postgresql://127.0.0.1:5432/$DATABASE" --username=postgres --password=postgres \
              --changeLogFile=changelogs/master-changelog.xml --searchPath=/db update
            docker run --rm --network host -v "$PWD/db:/db" liquibase/liquibase:4.29 \
              --url="jdbc:postgresql://127.0.0.1:5432/$DATABASE" --username=postgres --password=postgres \
              --changeLogFile=changelogs/master-changelog.xml --searchPath=/db update
          done
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d ONA_pr27 -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF (SELECT instructions IS NULL FROM survey WHERE name='PR27Legacy') IS NOT TRUE THEN RAISE EXCEPTION 'legacy default was not reconciled'; END IF; IF (SELECT instructions FROM survey WHERE name='PR27Hidden') <> '' THEN RAISE EXCEPTION 'empty override changed'; END IF; IF (SELECT instructions FROM survey WHERE name='PR27Custom') <> 'Preserve this administrator value' THEN RAISE EXCEPTION 'custom override changed'; END IF; IF (SELECT column_default FROM information_schema.columns WHERE table_name='survey' AND column_name='instructions') IS NOT NULL THEN RAISE EXCEPTION 'instructions default remains'; END IF; END \$\$;"
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d ONA_no_pr27_history -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF (SELECT instructions FROM survey WHERE name='PR27Legacy') IS DISTINCT FROM '$LEGACY' THEN RAISE EXCEPTION 'exact value changed without abandoned changeset evidence'; END IF; IF (SELECT count(*) FROM databasechangelog WHERE id='editable-survey-instructions-reconciliation-1' AND author='network-survey') <> 1 THEN RAISE EXCEPTION 'migration rerun history mismatch'; END IF; END \$\$;"

      - name: Verify production-shaped upgrade and migration rerun
        run: |
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres ONA_upgrade
          rm -rf /tmp/db-pre-lifecycle
          cp -a db /tmp/db-pre-lifecycle
          sed -i -e '/v1_6_survey_lifecycle_email_delivery.sql/d' -e '/v1_7_email_webhook_delivery_truth.sql/d' -e '/v1_8_bulk_survey_reminders.sql/d' -e '/v1_9_reminder_provider_account_binding.sql/d' -e '/v1_10_editable_survey_instructions.sql/d' -e '/v1_8_prod_secondary_controls.sql/d' -e '/v1_11_survey_email_history_pagination.sql/d' /tmp/db-pre-lifecycle/changelogs/master-changelog.xml
          docker run --rm --network host \
            -v /tmp/db-pre-lifecycle:/db \
            liquibase/liquibase:4.29 \
            --url=jdbc:postgresql://127.0.0.1:5432/ONA_upgrade \
            --username=postgres --password=postgres \
            --changeLogFile=changelogs/master-changelog.xml --searchPath=/db update
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d ONA_upgrade -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO survey(name,title,creation_date,questions,organization_id,archived_at)
          SELECT 'Upgrade Active','Active',now(),'{"elements":[{"type":"text","name":"question_1"}]}'::jsonb,id,NULL FROM organizations WHERE slug='default-imported';
          INSERT INTO survey(name,title,creation_date,questions,organization_id,archived_at)
          SELECT 'Upgrade Draft','Draft',now(),'{"elements":[{"type":"text","name":"question_1"}]}'::jsonb,id,NULL FROM organizations WHERE slug='default-imported';
          INSERT INTO survey(name,title,creation_date,questions,organization_id,archived_at)
          SELECT 'Upgrade Archived','Archived',now(),'{"elements":[]}'::jsonb,id,now() FROM organizations WHERE slug='default-imported';
          INSERT INTO respondent(name,contact_info,survey_name,can_respond,uuid,lang,response,email_sent,survey_id)
          SELECT 'Active Person','active@example.test',name,true,'upgrade-active-token','English','{"question_1":"yes"}'::jsonb,true,id FROM survey WHERE name='Upgrade Active';
          INSERT INTO email(survey_name,lang,text,survey_id)
          SELECT name,'English','Please participate',id FROM survey WHERE name IN ('Upgrade Active','Upgrade Draft');
          SQL
          # Rehearse the deployed production path exactly: the guarded CLA root
          # owns tenant backfill, then normal releases switch to master for the
          # lifecycle/webhook/reminder/instructions suffix. Reversing this order fails tenant preflight.
          docker run --rm --network host -v "$PWD/db:/db" liquibase/liquibase:4.29 \
            --url=jdbc:postgresql://127.0.0.1:5432/ONA_upgrade --username=postgres --password=postgres \
            --changeLogFile=changelogs/cla-production-cutover.xml --searchPath=/db update
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d ONA_upgrade -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT count(*) FROM databasechangelog WHERE id='cla-organization-backfill-1') <> 1 THEN
              RAISE EXCEPTION 'CLA backfill history mismatch';
            END IF;
            IF EXISTS (SELECT 1 FROM databasechangelog WHERE filename IN ('changelogs/v1_6_survey_lifecycle_email_delivery.sql','changelogs/v1_7_email_webhook_delivery_truth.sql','changelogs/v1_8_bulk_survey_reminders.sql','changelogs/v1_9_reminder_provider_account_binding.sql','changelogs/v1_10_editable_survey_instructions.sql','changelogs/v1_8_prod_secondary_controls.sql','changelogs/v1_11_survey_email_history_pagination.sql')) THEN
              RAISE EXCEPTION 'post-cutover master suffix ran too early';
            END IF;
          END $$;
          SQL
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres -T ONA_upgrade ONA_conflict
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d ONA_conflict -v ON_ERROR_STOP=1 \
            -c "ALTER TABLE respondent DROP CONSTRAINT respondent_survey_id_fkey" \
            -c "UPDATE respondent SET survey_id=gen_random_uuid() WHERE survey_name='Upgrade Active'"
          if docker run --rm --network host -v "$PWD/db:/db" liquibase/liquibase:4.29 \
            --url=jdbc:postgresql://127.0.0.1:5432/ONA_conflict --username=postgres --password=postgres \
            --changeLogFile=changelogs/master-changelog.xml --searchPath=/db update; then
            echo 'Expected orphaned stable-ID preflight to fail' >&2
            exit 1
          fi
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres -T ONA_upgrade ONA_lock_timeout
          (PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d ONA_lock_timeout -v ON_ERROR_STOP=1 -c 'BEGIN; LOCK TABLE survey IN ACCESS EXCLUSIVE MODE; SELECT pg_sleep(20); COMMIT') &
          LOCK_PID=$!
          sleep 1
          if docker run --rm --network host -v "$PWD/db:/db" liquibase/liquibase:4.29 \
            --url=jdbc:postgresql://127.0.0.1:5432/ONA_lock_timeout --username=postgres --password=postgres \
            --changeLogFile=changelogs/master-changelog.xml --searchPath=/db update; then
            echo 'Expected lifecycle migration lock timeout' >&2
            exit 1
          fi
          wait "$LOCK_PID"
          docker run --rm --network host -v "$PWD/db:/db" liquibase/liquibase:4.29 \
            --url=jdbc:postgresql://127.0.0.1:5432/ONA_lock_timeout --username=postgres --password=postgres \
            --changeLogFile=changelogs/master-changelog.xml --searchPath=/db update
          if PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d ONA_upgrade -v ON_ERROR_STOP=1 \
            -c 'CREATE UNIQUE INDEX CONCURRENTLY idx_survey_id_org_unique ON survey ((1))'; then
            echo 'Expected duplicate-key concurrent index build to leave a recoverable invalid index' >&2
            exit 1
          fi
          # Reproduce the published capability-1 schema, including an in-flight
          # generic leased reminder, before applying the isolated queue and
          # provider-binding suffix. This protects the real intermediate upgrade.
          rm -rf /tmp/db-capability1
          cp -a db /tmp/db-capability1
          sed -i -e '/v1_9_reminder_provider_account_binding.sql/d' -e '/v1_10_editable_survey_instructions.sql/d' -e '/v1_8_prod_secondary_controls.sql/d' -e '/v1_11_survey_email_history_pagination.sql/d' /tmp/db-capability1/changelogs/master-changelog.xml
          awk '/--changeset cladvisors:bulk-survey-reminder-isolated-queue-1/{exit} {print}' \
            db/changelogs/v1_8_bulk_survey_reminders.sql > /tmp/db-capability1/changelogs/v1_8_bulk_survey_reminders.sql
          docker run --rm --network host -v /tmp/db-capability1:/db liquibase/liquibase:4.29 \
            --url=jdbc:postgresql://127.0.0.1:5432/ONA_upgrade --username=postgres --password=postgres \
            --changeLogFile=changelogs/master-changelog.xml --searchPath=/db update
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d ONA_upgrade -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE launch_uuid uuid; delivery_uuid uuid; lease_uuid uuid := gen_random_uuid();
                  target_survey survey%ROWTYPE; target_respondent respondent%ROWTYPE; actor_id integer;
          BEGIN
            SELECT * INTO target_survey FROM survey WHERE name='Upgrade Active';
            SELECT * INTO target_respondent FROM respondent WHERE survey_id=target_survey.id LIMIT 1;
            SELECT id INTO actor_id FROM users ORDER BY id LIMIT 1;
            IF actor_id IS NULL THEN
              INSERT INTO users(username,password,email) VALUES('upgrade-actor','x','upgrade@example.test') RETURNING id INTO actor_id;
            END IF;
            INSERT INTO survey_launches(survey_id,organization_id,kind,idempotency_key,request_fingerprint,requested_by_user_id)
              VALUES(target_survey.id,target_survey.organization_id,'reminder','capability-1-upgrade','capability-1-upgrade',actor_id)
              RETURNING id INTO launch_uuid;
            INSERT INTO survey_launch_templates(launch_id,language,subject,body_text,template_hash)
              VALUES(launch_uuid,'english','Legacy reminder','Legacy body','legacy-template');
            INSERT INTO survey_email_deliveries(launch_id,survey_id,organization_id,respondent_id,to_address,language,sender,subject,template_hash,survey_base_url,renderer_version,render_inputs,expected_payload_hash,status,provider_idempotency_key,attempt_count,lease_owner,lease_token,lease_expires_at)
              VALUES(launch_uuid,target_survey.id,target_survey.organization_id,target_respondent.respondent_id,'legacy@example.test','english','sender@example.test','Legacy reminder','legacy-template','https://survey.example.test','v3','{}','legacy-payload','leased','legacy-provider-key',1,'capability-1-worker',lease_uuid,now()+interval '5 minutes')
              RETURNING id INTO delivery_uuid;
            INSERT INTO survey_email_attempts(delivery_id,attempt_number,lease_token,outcome,provider_started_at)
              VALUES(delivery_uuid,1,lease_uuid,'in_progress',now());
          END $$;
          SQL
          # Exercise v1_11 recovery from a stale same-name index left before the
          # changeset was recorded; the migration must replace it with the exact
          # tenant-scoped keyset index and remain rerunnable.
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d ONA_upgrade -v ON_ERROR_STOP=1 \
            -c 'CREATE INDEX delivery_survey_history_page ON survey_email_deliveries(id)'
          trap 'kill "${WRITER_PID:-}" 2>/dev/null || true' EXIT
          (
            while true; do
              PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d ONA_upgrade -c "UPDATE survey SET title=title WHERE name='Upgrade Draft'" >/dev/null
              sleep 0.1
            done
          ) &
          WRITER_PID=$!
          docker run --rm --network host \
            -v "$PWD/db:/db" \
            liquibase/liquibase:4.29 \
            --url=jdbc:postgresql://127.0.0.1:5432/ONA_upgrade \
            --username=postgres --password=postgres \
            --changeLogFile=changelogs/master-changelog.xml --searchPath=/db update
          kill "$WRITER_PID" 2>/dev/null || true
          wait "$WRITER_PID" 2>/dev/null || true
          unset WRITER_PID
          trap - EXIT
          docker run --rm --network host \
            -v "$PWD/db:/db" \
            liquibase/liquibase:4.29 \
            --url=jdbc:postgresql://127.0.0.1:5432/ONA_upgrade \
            --username=postgres --password=postgres \
            --changeLogFile=changelogs/master-changelog.xml --searchPath=/db update
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d ONA_upgrade -v ON_ERROR_STOP=1 \
            -c "SELECT lifecycle_status,count(*) FROM survey WHERE name LIKE 'Upgrade %' GROUP BY lifecycle_status ORDER BY lifecycle_status" \
            -c "SELECT c.relname,i.indisvalid,i.indisready FROM pg_index i JOIN pg_class c ON c.oid=i.indexrelid WHERE c.relname IN ('survey_id_key','idx_survey_id_org_unique','idx_respondent_id_survey_unique') AND (NOT i.indisvalid OR NOT i.indisready)" \
            -c 'DO $$ BEGIN IF EXISTS (SELECT 1 FROM pg_index i JOIN pg_class c ON c.oid=i.indexrelid WHERE c.relname IN ('\''survey_id_key'\'','\''idx_survey_id_org_unique'\'','\''idx_respondent_id_survey_unique'\'') AND (NOT i.indisvalid OR NOT i.indisready)) THEN RAISE EXCEPTION '\''invalid lifecycle index remains'\''; END IF; IF (SELECT count(*) FROM email_worker_control) <> 5 THEN RAISE EXCEPTION '\''worker controls missing'\''; END IF; IF EXISTS (SELECT 1 FROM email_worker_control WHERE environment='\''prod-secondary'\'' AND claiming_enabled) OR EXISTS (SELECT 1 FROM email_sending_control WHERE environment='\''prod-secondary'\'' AND sending_enabled) OR EXISTS (SELECT 1 FROM webhook_worker_control WHERE environment='\''prod-secondary'\'' AND processing_enabled) OR EXISTS (SELECT 1 FROM email_suppression_control WHERE environment='\''prod-secondary'\'' AND enforcement_enabled) THEN RAISE EXCEPTION '\''prod-secondary controls must remain disabled'\''; END IF; IF (SELECT count(*) FROM databasechangelog WHERE id='\''cla-organization-backfill-1'\'') <> 1 THEN RAISE EXCEPTION '\''CLA backfill history changed during master transition'\''; END IF; IF (SELECT count(*) FROM databasechangelog WHERE filename='\''changelogs/v1_6_survey_lifecycle_email_delivery.sql'\'') <> 7 THEN RAISE EXCEPTION '\''lifecycle changeset manifest mismatch'\''; END IF; IF (SELECT count(*) FROM databasechangelog WHERE filename='\''changelogs/v1_7_email_webhook_delivery_truth.sql'\'') <> 8 THEN RAISE EXCEPTION '\''webhook changeset manifest mismatch'\''; END IF; IF (SELECT count(*) FROM databasechangelog WHERE filename='\''changelogs/v1_8_bulk_survey_reminders.sql'\'') <> 4 THEN RAISE EXCEPTION '\''reminder changeset manifest mismatch'\''; END IF; IF (SELECT count(*) FROM databasechangelog WHERE filename='\''changelogs/v1_9_reminder_provider_account_binding.sql'\'') <> 1 THEN RAISE EXCEPTION '\''reminder provider binding changeset manifest mismatch'\''; END IF; IF (SELECT count(*) FROM databasechangelog WHERE filename='\''changelogs/v1_10_editable_survey_instructions.sql'\'') <> 1 THEN RAISE EXCEPTION '\''instructions changeset manifest mismatch'\''; END IF; IF (SELECT count(*) FROM databasechangelog WHERE id='\''prod-secondary-disabled-controls-1'\'' AND author='\''network-survey'\'' AND filename='\''changelogs/v1_8_prod_secondary_controls.sql'\'') <> 1 THEN RAISE EXCEPTION '\''prod-secondary deployed migration identity mismatch'\''; END IF; IF (SELECT count(*) FROM databasechangelog WHERE filename='\''changelogs/v1_11_survey_email_history_pagination.sql'\'') <> 1 THEN RAISE EXCEPTION '\''email history changeset manifest mismatch'\''; END IF; IF NOT EXISTS (SELECT 1 FROM pg_index WHERE indexrelid=to_regclass('\''delivery_survey_history_page'\'') AND indisvalid AND indisready AND pg_get_indexdef(indexrelid) LIKE '\''%(survey_id, organization_id, created_at DESC, id DESC)'\'') THEN RAISE EXCEPTION '\''email history pagination index missing, invalid, or incorrectly defined'\''; END IF; IF NOT EXISTS (SELECT 1 FROM survey_email_deliveries d JOIN survey_launches l ON l.id=d.launch_id WHERE l.idempotency_key='\''capability-1-upgrade'\'' AND d.status='\''reminder_leased'\'' AND l.provider_account_scope IS NULL) THEN RAISE EXCEPTION '\''capability-1 reminder was not safely converted and quarantined'\''; END IF; IF (SELECT count(*) FROM survey WHERE name LIKE '\''Upgrade %'\'' AND lifecycle_status='\''active'\'') <> 1 THEN RAISE EXCEPTION '\''active backfill mismatch'\''; END IF; IF (SELECT count(*) FROM survey WHERE name LIKE '\''Upgrade %'\'' AND lifecycle_status='\''draft'\'') <> 1 THEN RAISE EXCEPTION '\''draft backfill mismatch'\''; END IF; IF (SELECT count(*) FROM survey WHERE name LIKE '\''Upgrade %'\'' AND lifecycle_status='\''closed'\'') <> 1 THEN RAISE EXCEPTION '\''closed backfill mismatch'\''; END IF; END $$;'

      - name: Validate prod-secondary Resend isolation contract
        run: node scripts/ci/validate-prod-secondary-resend-config.js

      - name: Install API dependencies
        run: npm ci --workspaces=false
        working-directory: api

      - name: Run API unit/security tests
        run: npm test
        working-directory: api

      - name: Smoke test API against migrated database
        run: bash scripts/ci/api-smoke.sh

      - name: Smoke test webhook projection and suppression fencing
        env:
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: ONA
          SURVEY_URL: http://localhost:3002
        run: node scripts/ci/webhook-worker-smoke.js

  frontend:
    name: Build & test (${{ matrix.app }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: [dashboard, network-survey]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Test
        run: npm test
        working-directory: ${{ matrix.app }}

      - name: Build
        # CI=false: CRA treats lint warnings as errors when CI=true; the
        # existing code has warnings. Tighten this once they are cleaned up.
        run: CI=false npm run build
        working-directory: ${{ matrix.app }}
