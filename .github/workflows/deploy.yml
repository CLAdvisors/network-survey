name: Deploy

on:
  push:
    branches: [main] # auto-deploys to staging
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [staging, production, prod-secondary]

permissions:
  id-token: write # OIDC federation to AWS — no long-lived keys
  contents: read

concurrency:
  # Serialize API release operations (deploys and previous-artifact redeploys)
  # per environment so SSM/PM2/current symlink/latest.tar.gz cannot race.
  group: api-release-${{ github.event_name == 'push' && 'staging' || inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # "production" can be given required reviewers under Settings → Environments
    environment: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Assert target AWS account
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'prod-secondary' }}
        env:
          EXPECTED_ACCOUNT_ID: '710054969994'
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          case "$ROLE_ARN" in
            arn:aws:iam::${EXPECTED_ACCOUNT_ID}:role/*) ;;
            *) echo "prod-secondary AWS_DEPLOY_ROLE_ARN must belong to account $EXPECTED_ACCOUNT_ID" >&2; exit 1 ;;
          esac
          ACTUAL_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          test "$ACTUAL_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID" || {
            echo "Refusing prod-secondary deploy in AWS account $ACTUAL_ACCOUNT_ID" >&2
            exit 1
          }

      - name: Resolve environment resources
        id: env
        env:
          CONFIGURED_TF_ENV: ${{ vars.TF_ENV }}
          CONFIGURED_API_HOST: ${{ vars.API_HOST }}
          CONFIGURED_DASHBOARD_HOST: ${{ vars.DASHBOARD_HOST }}
          CONFIGURED_SURVEY_HOST: ${{ vars.SURVEY_HOST }}
          CONFIGURED_API_ASG_NAME: ${{ vars.API_ASG_NAME }}
          CONFIGURED_RESOURCE_TAGGING_REGION: ${{ vars.AWS_RESOURCE_TAGGING_REGION }}
        run: |
          set -euo pipefail
          GH_ENV="${{ github.event_name == 'push' && 'staging' || inputs.environment }}"
          DEPLOYMENT_MODE=singleton
          case "$GH_ENV" in
            production)
              DEFAULT_TF_ENV=prod
              DEFAULT_API_HOST=demo.ona.api.bennetts.work
              DEFAULT_DASHBOARD_HOST=demo.ona.dashboard.bennetts.work
              DEFAULT_SURVEY_HOST=survey.cladvisorsurveys.com
              ;;
            staging)
              DEFAULT_TF_ENV=staging
              DEFAULT_API_HOST=staging.ona.api.bennetts.work
              DEFAULT_DASHBOARD_HOST=staging.ona.dashboard.bennetts.work
              DEFAULT_SURVEY_HOST=staging.ona.survey.bennetts.work
              ;;
            prod-secondary)
              DEFAULT_TF_ENV=prod-secondary
              DEPLOYMENT_MODE=asg
              ;;
            *) echo "Unknown environment: $GH_ENV" >&2; exit 1 ;;
          esac
          TF_ENV="${CONFIGURED_TF_ENV:-$DEFAULT_TF_ENV}"
          if [ "$GH_ENV" = prod-secondary ] && [ "$TF_ENV" != prod-secondary ]; then
            echo "prod-secondary TF_ENV must be exactly prod-secondary" >&2
            exit 1
          fi

          # CloudFront resources are resolved through the us-east-1 tagging API.
          by_tag_exact() { # app-tag resource-type-filter
            local app="$1"
            local resource_type="$2"
            local region="${3:-us-east-1}"
            local arns
            arns=$(aws resourcegroupstaggingapi get-resources \
              --region "$region" \
              --resource-type-filters "$resource_type" \
              --tag-filters "Key=Environment,Values=$TF_ENV" "Key=App,Values=$app" \
              --query 'ResourceTagMappingList[].ResourceARN' --output text | tr '\t' '\n' | sed '/^$/d')
            local count
            count=$(printf '%s\n' "$arns" | sed '/^$/d' | wc -l | tr -d ' ')
            if [ "$count" != "1" ]; then
              echo "Expected exactly one $resource_type with Environment=$TF_ENV App=$app, found $count:" >&2
              printf '%s\n' "$arns" >&2
              exit 1
            fi
            printf '%s\n' "$arns"
          }

          instance_exact() {
            local ids
            ids=$(aws ec2 describe-instances \
              --filters "Name=tag:Environment,Values=$TF_ENV" "Name=tag:App,Values=ona-api" \
                        "Name=instance-state-name,Values=running" \
              --query 'Reservations[].Instances[].InstanceId' --output text | tr '\t' '\n' | sed '/^$/d')
            local count
            count=$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l | tr -d ' ')
            if [ "$count" != "1" ]; then
              echo "Expected exactly one running API instance with Environment=$TF_ENV App=ona-api, found $count:" >&2
              printf '%s\n' "$ids" >&2
              exit 1
            fi
            printf '%s\n' "$ids"
          }

          RESOURCE_REGION=us-east-1
          [ "$DEPLOYMENT_MODE" = asg ] && RESOURCE_REGION="${CONFIGURED_RESOURCE_TAGGING_REGION:-$AWS_REGION}"
          DASHBOARD_BUCKET=$(by_tag_exact ona-dashboard s3:bucket "$RESOURCE_REGION" | sed 's|.*:::||')
          SURVEY_BUCKET=$(by_tag_exact ona-survey s3:bucket "$RESOURCE_REGION" | sed 's|.*:::||')
          ARTIFACTS_BUCKET=$(by_tag_exact ona-artifacts s3:bucket "$RESOURCE_REGION" | sed 's|.*:::||')
          DASHBOARD_DIST=$(by_tag_exact ona-dashboard cloudfront:distribution | sed 's|.*/||')
          SURVEY_DIST=$(by_tag_exact ona-survey cloudfront:distribution | sed 's|.*/||')

          if [ "$DEPLOYMENT_MODE" = asg ]; then
            ASG_NAME="$CONFIGURED_API_ASG_NAME"
            test -n "$ASG_NAME" || { echo 'prod-secondary API_ASG_NAME variable is required' >&2; exit 1; }
            ASG_COUNT=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
              --query 'length(AutoScalingGroups)' --output text)
            test "$ASG_COUNT" = 1 || { echo "Expected ASG $ASG_NAME" >&2; exit 1; }
            ASG_ENV=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
              --query "AutoScalingGroups[0].Tags[?Key=='Environment'].Value | [0]" --output text)
            ASG_APP=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
              --query "AutoScalingGroups[0].Tags[?Key=='App'].Value | [0]" --output text)
            test "$ASG_ENV" = prod-secondary && test "$ASG_APP" = ona-api || {
              echo "ASG $ASG_NAME must have Environment=prod-secondary and App=ona-api" >&2
              exit 1
            }
            TARGET_GROUP_COUNT=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
              --query 'length(AutoScalingGroups[0].TargetGroupARNs)' --output text)
            test "$TARGET_GROUP_COUNT" -gt 0 || { echo "ASG $ASG_NAME has no target group" >&2; exit 1; }
            ALB_ARN=$(by_tag_exact ona-api elasticloadbalancing:loadbalancer "$AWS_REGION")
            API_EDGE_DIST=$(by_tag_exact ona-api-edge cloudfront:distribution | sed 's|.*/||')
            API_HOST=$(aws cloudfront get-distribution --id "$API_EDGE_DIST" \
              --query 'Distribution.DomainName' --output text)
            DASHBOARD_HOST=$(aws cloudfront get-distribution --id "$DASHBOARD_DIST" \
              --query 'Distribution.DomainName' --output text)
            SURVEY_HOST=$(aws cloudfront get-distribution --id "$SURVEY_DIST" \
              --query 'Distribution.DomainName' --output text)
            DASHBOARD_ENABLED=$(aws cloudfront get-distribution --id "$DASHBOARD_DIST" --query 'Distribution.DistributionConfig.Enabled' --output text)
            SURVEY_ENABLED=$(aws cloudfront get-distribution --id "$SURVEY_DIST" --query 'Distribution.DistributionConfig.Enabled' --output text)
            if [ "$DASHBOARD_ENABLED" = True ] && [ "$SURVEY_ENABLED" = True ]; then FRONTENDS_ENABLED=true; else FRONTENDS_ENABLED=false; fi
            INSTANCE_ID=
          else
            ASG_NAME=
            FRONTENDS_ENABLED=true
            INSTANCE_ID=$(instance_exact)
            API_HOST="${CONFIGURED_API_HOST:-$DEFAULT_API_HOST}"
            DASHBOARD_HOST="${CONFIGURED_DASHBOARD_HOST:-$DEFAULT_DASHBOARD_HOST}"
            SURVEY_HOST="${CONFIGURED_SURVEY_HOST:-$DEFAULT_SURVEY_HOST}"
          fi

          for v in DASHBOARD_BUCKET SURVEY_BUCKET ARTIFACTS_BUCKET DASHBOARD_DIST SURVEY_DIST API_HOST DASHBOARD_HOST SURVEY_HOST; do
            if [ -z "${!v}" ] || [ "${!v}" = "None" ]; then
              echo "Failed to resolve $v for environment $TF_ENV" >&2
              exit 1
            fi
            echo "$v=${!v}" >> "$GITHUB_OUTPUT"
            echo "$v=${!v}"
          done
          echo "DEPLOYMENT_MODE=$DEPLOYMENT_MODE" >> "$GITHUB_OUTPUT"
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "ASG_NAME=$ASG_NAME" >> "$GITHUB_OUTPUT"
          echo "ALB_ARN=${ALB_ARN:-}" >> "$GITHUB_OUTPUT"
          echo "FRONTENDS_ENABLED=$FRONTENDS_ENABLED" >> "$GITHUB_OUTPUT"

      # ---------- API: package → S3 → install via SSM (no instance rebuild) ----------

      - name: Package API release artifact
        run: |
          set -euo pipefail
          STAGE_DIR=$(mktemp -d)
          mkdir -p "$STAGE_DIR/deploy" "$STAGE_DIR/db"
          rsync -a --exclude node_modules api "$STAGE_DIR/"
          cp -a db/changelogs "$STAGE_DIR/db/"
          cp scripts/deploy/remote-deploy.sh scripts/deploy/*.js \
             scripts/deploy/CAPABILITIES.json "$STAGE_DIR/deploy/"
          echo "$GITHUB_SHA" > "$STAGE_DIR/REVISION"
          node "$STAGE_DIR/deploy/validate-release-capabilities.js" "$STAGE_DIR"
          test -f "$STAGE_DIR/api/webhook-worker.js"
          tar -czf api-release.tar.gz -C "$STAGE_DIR" .

      - name: Upload artifact to S3
        run: |
          aws s3 cp api-release.tar.gz \
            "s3://${{ steps.env.outputs.ARTIFACTS_BUCKET }}/api/$GITHUB_SHA.tar.gz"

      - name: Deploy API via SSM
        run: |
          set -euo pipefail
          BUCKET="${{ steps.env.outputs.ARTIFACTS_BUCKET }}"
          MODE="${{ steps.env.outputs.DEPLOYMENT_MODE }}"
          ASG_NAME="${{ steps.env.outputs.ASG_NAME }}"

          # AWS-RunShellScript executes with /bin/sh, so remote commands remain POSIX.
          jq -n --arg bucket "$BUCKET" --arg sha "$GITHUB_SHA" --arg region "$AWS_REGION" '{
            commands: [
              "set -eu",
              "export AWS_DEFAULT_REGION=\($region)",
              "rm -rf /tmp/ona-deploy && mkdir -p /tmp/ona-deploy",
              "aws s3 cp s3://\($bucket)/api/\($sha).tar.gz /tmp/ona-deploy/release.tar.gz",
              "tar -xzf /tmp/ona-deploy/release.tar.gz -C /tmp/ona-deploy",
              "bash /tmp/ona-deploy/deploy/remote-deploy.sh /tmp/ona-deploy",
              "rm -rf /tmp/ona-deploy"
            ]
          }' > /tmp/ssm-params.json

          wait_target_health() {
            local instance="$1"
            local target_group
            [ "$MODE" = asg ] || return 0
            for target_group in $(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
              --query 'AutoScalingGroups[0].TargetGroupARNs' --output text); do
              aws elbv2 wait target-in-service --target-group-arn "$target_group" --targets "Id=$instance"
            done
          }

          deploy_instance() {
            local instance="$1"
            local command_id status
            command_id=$(aws ssm send-command \
              --instance-ids "$instance" \
              --document-name AWS-RunShellScript \
              --comment "Deploy API $GITHUB_SHA" \
              --parameters file:///tmp/ssm-params.json \
              --query 'Command.CommandId' --output text)
            echo "SSM command $command_id on $instance"
            while true; do
              status=$(aws ssm get-command-invocation \
                --command-id "$command_id" --instance-id "$instance" \
                --query Status --output text 2>/dev/null || echo Pending)
              case "$status" in
                Success|Failed|Cancelled|TimedOut) break ;;
                *) sleep 5 ;;
              esac
            done
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
              --query StandardOutputContent --output text
            if [ "$status" != Success ]; then
              echo "Deploy failed on $instance with status $status; stderr:" >&2
              aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
                --query StandardErrorContent --output text >&2
              return 1
            fi
            wait_target_health "$instance"
          }

          stable_asg_instances() {
            local state desired count total
            for _ in $(seq 1 60); do
              state=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
                --query 'AutoScalingGroups[0].[DesiredCapacity,length(Instances[?LifecycleState==`InService` && HealthStatus==`Healthy`]),length(Instances)]' \
                --output text)
              read -r desired count total <<< "$state"
              if [ "$desired" -gt 0 ] && [ "$count" -eq "$desired" ] && [ "$total" -eq "$desired" ]; then
                aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
                  --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService` && HealthStatus==`Healthy`].InstanceId' \
                  --output text | tr '\t' '\n' | sed '/^$/d' | sort
                return
              fi
              sleep 10
            done
            echo "ASG $ASG_NAME did not reach a stable healthy state" >&2
            return 1
          }

          if [ "$MODE" = singleton ]; then
            deploy_instance "${{ steps.env.outputs.INSTANCE_ID }}"
          else
            # Re-resolve between passes. This handles an ASG replacement that creates
            # temporary zero/multiple instances without selecting an arbitrary host.
            declare -A deployed=()
            promoted=false
            for _ in $(seq 1 5); do
              instances_text=$(stable_asg_instances)
              mapfile -t instances <<< "$instances_text"
              for instance in "${instances[@]}"; do
                if [ -z "${deployed[$instance]:-}" ]; then
                  deploy_instance "$instance"
                  deployed[$instance]=1
                  if ! $promoted; then
                    # Once one target host verifies the artifact, make ASG replacements
                    # during this rollout bootstrap that same compatible release.
                    aws s3 cp "s3://$BUCKET/api/$GITHUB_SHA.tar.gz" \
                      "s3://$BUCKET/api/latest-compatible.tar.gz"
                    promoted=true
                  fi
                fi
              done
              current_text=$(stable_asg_instances)
              mapfile -t current <<< "$current_text"
              complete=true
              for instance in "${current[@]}"; do
                [ -n "${deployed[$instance]:-}" ] || complete=false
              done
              if $complete && [ "${instances[*]}" = "${current[*]}" ]; then
                exit 0
              fi
            done
            echo "ASG membership did not stabilize on fully deployed instances" >&2
            exit 1
          fi

      - name: Promote bootstrappable API artifact
        # The on-instance installer has already verified the exact API and both
        # workers. Promote this pointer before unrelated frontend publication so
        # replacement instances cannot bootstrap an older capability floor.
        run: |
          aws s3 cp \
            "s3://${{ steps.env.outputs.ARTIFACTS_BUCKET }}/api/$GITHUB_SHA.tar.gz" \
            "s3://${{ steps.env.outputs.ARTIFACTS_BUCKET }}/api/latest-compatible.tar.gz"

      # ---------- Frontends: build → S3 sync → CloudFront invalidation ----------

      - name: Build dashboard
        working-directory: dashboard
        env:
          REACT_APP_API_PROTOCOL: https
          REACT_APP_API_HOST: ${{ steps.env.outputs.API_HOST }}
          REACT_APP_API_PORT: 443
          REACT_APP_SURVEY_PROTOCOL: https
          REACT_APP_SURVEY_ENDPOINT: ${{ steps.env.outputs.SURVEY_HOST }}
        run: |
          npm ci
          CI=false npm run build

      - name: Build survey app
        working-directory: network-survey
        env:
          REACT_APP_API_PROTOCOL: https
          REACT_APP_API_HOST: ${{ steps.env.outputs.API_HOST }}
          REACT_APP_API_PORT: 443
        run: |
          npm ci
          CI=false npm run build

      - name: Publish dashboard
        if: ${{ steps.env.outputs.FRONTENDS_ENABLED == 'true' }}
        run: |
          aws s3 sync dashboard/dist "s3://${{ steps.env.outputs.DASHBOARD_BUCKET }}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.env.outputs.DASHBOARD_DIST }}" --paths "/*"

      - name: Publish survey app
        if: ${{ steps.env.outputs.FRONTENDS_ENABLED == 'true' }}
        run: |
          aws s3 sync network-survey/dist "s3://${{ steps.env.outputs.SURVEY_BUCKET }}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.env.outputs.SURVEY_DIST }}" --paths "/*"

      - name: External smoke checks
        run: |
          set -euo pipefail
          if [ "${{ steps.env.outputs.DEPLOYMENT_MODE }}" = asg ]; then
            # Before custom DNS, validate the AWS ALB endpoint through its target
            # groups; the ALB certificate intentionally does not cover its AWS DNS name.
            for target_group in $(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "${{ steps.env.outputs.ASG_NAME }}" \
              --query 'AutoScalingGroups[0].TargetGroupARNs' --output text); do
              UNHEALTHY=$(aws elbv2 describe-target-health --target-group-arn "$target_group" \
                --query 'length(TargetHealthDescriptions[?TargetHealth.State!=`healthy`])' --output text)
              test "$UNHEALTHY" = 0
            done
            curl -fsS "https://${{ steps.env.outputs.API_HOST }}/health" | grep -q '"database":"ok"'
          else
            curl -fsS "https://${{ steps.env.outputs.API_HOST }}/health" | grep -q '"database":"ok"'
          fi
          if [ "${{ steps.env.outputs.FRONTENDS_ENABLED }}" = true ]; then
            curl -fsS -o /dev/null "https://${{ steps.env.outputs.DASHBOARD_HOST }}/"
            curl -fsS -o /dev/null "https://${{ steps.env.outputs.SURVEY_HOST }}/"

            DASHBOARD_ASSET=$(find dashboard/dist/assets -maxdepth 1 -type f -name '*.js' -printf '/assets/%f\n' | head -n 1)
            SURVEY_ASSET=$(find network-survey/dist/assets -maxdepth 1 -type f -name '*.js' -printf '/assets/%f\n' | head -n 1)
            test -n "$DASHBOARD_ASSET"
            test -n "$SURVEY_ASSET"
            curl -fsS -o /dev/null "https://${{ steps.env.outputs.DASHBOARD_HOST }}$DASHBOARD_ASSET"
            curl -fsS -o /dev/null "https://${{ steps.env.outputs.SURVEY_HOST }}$SURVEY_ASSET"
          fi

      - name: Mark release as latest
        # Only after the on-instance deploy and external smoke checks pass, so
        # replacement instances bootstrap the last externally verified release.
        run: |
          aws s3 cp \
            "s3://${{ steps.env.outputs.ARTIFACTS_BUCKET }}/api/$GITHUB_SHA.tar.gz" \
            "s3://${{ steps.env.outputs.ARTIFACTS_BUCKET }}/api/latest.tar.gz"
