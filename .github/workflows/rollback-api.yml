name: Redeploy API Artifact

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to redeploy into
        required: true
        type: choice
        options: [staging, production, prod-secondary]
      artifact_sha:
        description: Git SHA of a previously published API artifact
        required: true
        type: string
      mark_latest:
        description: Mark this artifact as latest after successful external smoke check
        required: true
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  # Shared with deploy.yml so API release operations cannot race.
  group: api-release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  redeploy-api-artifact:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Assert target AWS account
        if: ${{ inputs.environment == 'prod-secondary' }}
        env:
          EXPECTED_ACCOUNT_ID: '710054969994'
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          case "$ROLE_ARN" in
            arn:aws:iam::${EXPECTED_ACCOUNT_ID}:role/*) ;;
            *) echo "prod-secondary AWS_DEPLOY_ROLE_ARN must belong to account $EXPECTED_ACCOUNT_ID" >&2; exit 1 ;;
          esac
          ACTUAL_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          test "$ACTUAL_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID" || {
            echo "Refusing prod-secondary redeploy in AWS account $ACTUAL_ACCOUNT_ID" >&2
            exit 1
          }

      - name: Resolve API resources
        id: env
        env:
          CONFIGURED_TF_ENV: ${{ vars.TF_ENV }}
          CONFIGURED_API_HOST: ${{ vars.API_HOST }}
          CONFIGURED_API_ASG_NAME: ${{ vars.API_ASG_NAME }}
          CONFIGURED_RESOURCE_TAGGING_REGION: ${{ vars.AWS_RESOURCE_TAGGING_REGION }}
        run: |
          set -euo pipefail
          MODE=singleton
          case "${{ inputs.environment }}" in
            production)
              DEFAULT_TF_ENV=prod
              DEFAULT_API_HOST=demo.ona.api.bennetts.work
              ;;
            staging)
              DEFAULT_TF_ENV=staging
              DEFAULT_API_HOST=staging.ona.api.bennetts.work
              ;;
            prod-secondary)
              DEFAULT_TF_ENV=prod-secondary
              MODE=asg
              ;;
            *) echo "Unknown environment: ${{ inputs.environment }}" >&2; exit 1 ;;
          esac
          TF_ENV="${CONFIGURED_TF_ENV:-$DEFAULT_TF_ENV}"
          if [ "${{ inputs.environment }}" = prod-secondary ] && [ "$TF_ENV" != prod-secondary ]; then
            echo "prod-secondary TF_ENV must be exactly prod-secondary" >&2
            exit 1
          fi

          by_tag_exact() {
            local app="$1"
            local resource_type="$2"
            local region="${3:-us-east-1}"
            local arns
            arns=$(aws resourcegroupstaggingapi get-resources \
              --region "$region" \
              --resource-type-filters "$resource_type" \
              --tag-filters "Key=Environment,Values=$TF_ENV" "Key=App,Values=$app" \
              --query 'ResourceTagMappingList[].ResourceARN' --output text | tr '\t' '\n' | sed '/^$/d')
            local count
            count=$(printf '%s\n' "$arns" | sed '/^$/d' | wc -l | tr -d ' ')
            if [ "$count" != "1" ]; then
              echo "Expected exactly one $resource_type with Environment=$TF_ENV App=$app, found $count:" >&2
              printf '%s\n' "$arns" >&2
              exit 1
            fi
            printf '%s\n' "$arns"
          }

          instance_exact() {
            local ids
            ids=$(aws ec2 describe-instances \
              --filters "Name=tag:Environment,Values=$TF_ENV" "Name=tag:App,Values=ona-api" \
                        "Name=instance-state-name,Values=running" \
              --query 'Reservations[].Instances[].InstanceId' --output text | tr '\t' '\n' | sed '/^$/d')
            local count
            count=$(printf '%s\n' "$ids" | sed '/^$/d' | wc -l | tr -d ' ')
            if [ "$count" != "1" ]; then
              echo "Expected exactly one running API instance with Environment=$TF_ENV App=ona-api, found $count:" >&2
              printf '%s\n' "$ids" >&2
              exit 1
            fi
            printf '%s\n' "$ids"
          }

          RESOURCE_REGION=us-east-1
          [ "$MODE" = asg ] && RESOURCE_REGION="${CONFIGURED_RESOURCE_TAGGING_REGION:-$AWS_REGION}"
          ARTIFACTS_BUCKET=$(by_tag_exact ona-artifacts s3:bucket "$RESOURCE_REGION" | sed 's|.*:::||')
          if [ "$MODE" = asg ]; then
            ASG_NAME="$CONFIGURED_API_ASG_NAME"
            test -n "$ASG_NAME" || { echo 'prod-secondary API_ASG_NAME variable is required' >&2; exit 1; }
            ASG_ENV=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
              --query "AutoScalingGroups[0].Tags[?Key=='Environment'].Value | [0]" --output text)
            ASG_APP=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
              --query "AutoScalingGroups[0].Tags[?Key=='App'].Value | [0]" --output text)
            test "$ASG_ENV" = prod-secondary && test "$ASG_APP" = ona-api || {
              echo "ASG $ASG_NAME must have Environment=prod-secondary and App=ona-api" >&2
              exit 1
            }
            TARGET_GROUP_COUNT=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
              --query 'length(AutoScalingGroups[0].TargetGroupARNs)' --output text)
            test "$TARGET_GROUP_COUNT" -gt 0 || { echo "ASG $ASG_NAME has no target group" >&2; exit 1; }
            ALB_ARN=$(by_tag_exact ona-api elasticloadbalancing:loadbalancer "$AWS_REGION")
            API_HOST=$(aws elbv2 describe-load-balancers --load-balancer-arns "$ALB_ARN" \
              --query 'LoadBalancers[0].DNSName' --output text)
            INSTANCE_ID=
          else
            ASG_NAME=
            INSTANCE_ID=$(instance_exact)
            API_HOST="${CONFIGURED_API_HOST:-$DEFAULT_API_HOST}"
          fi

          for v in ARTIFACTS_BUCKET API_HOST; do
            if [ -z "${!v}" ] || [ "${!v}" = "None" ]; then
              echo "Failed to resolve $v for environment $TF_ENV" >&2
              exit 1
            fi
            echo "$v=${!v}" >> "$GITHUB_OUTPUT"
            echo "$v=${!v}"
          done
          echo "DEPLOYMENT_MODE=$MODE" >> "$GITHUB_OUTPUT"
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "ASG_NAME=$ASG_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify requested artifact exists
        run: |
          if [ "${{ steps.env.outputs.DEPLOYMENT_MODE }}" = asg ] && [ "${{ inputs.mark_latest }}" != true ]; then
            echo "prod-secondary ASG redeploys must update latest-compatible for replacement safety" >&2
            exit 1
          fi
          aws s3api head-object \
            --bucket "${{ steps.env.outputs.ARTIFACTS_BUCKET }}" \
            --key "api/${{ inputs.artifact_sha }}.tar.gz"

      - name: Redeploy selected API artifact via SSM
        run: |
          set -euo pipefail
          BUCKET="${{ steps.env.outputs.ARTIFACTS_BUCKET }}"
          MODE="${{ steps.env.outputs.DEPLOYMENT_MODE }}"
          ASG_NAME="${{ steps.env.outputs.ASG_NAME }}"
          SHA="${{ inputs.artifact_sha }}"
          # The validator is supplied by this trusted workflow revision, not by
          # either the currently installed or rollback-target artifact.
          TRUSTED_VALIDATOR_B64=$(base64 -w0 scripts/deploy/validate-release-capabilities.js)
          CAPABILITY_FLAGS=
          if [ "${{ inputs.environment }}" = prod-secondary ]; then
            CAPABILITY_FLAGS=--require-prod-secondary-resend-isolation
          fi

          jq -n --arg bucket "$BUCKET" --arg sha "$SHA" --arg region "$AWS_REGION" --arg validator "$TRUSTED_VALIDATOR_B64" --arg capability_flags "$CAPABILITY_FLAGS" '{
            commands: [
              "set -eu",
              "export AWS_DEFAULT_REGION=\($region)",
              "rm -rf /tmp/ona-deploy && mkdir -p /tmp/ona-deploy",
              "aws s3 cp s3://\($bucket)/api/\($sha).tar.gz /tmp/ona-deploy/release.tar.gz",
              "tar -xzf /tmp/ona-deploy/release.tar.gz -C /tmp/ona-deploy",
              "test -f /tmp/ona-deploy/api/lifecycle.js && test -f /tmp/ona-deploy/api/email-worker.js && test -f /tmp/ona-deploy/api/webhook-worker.js && test -f /tmp/ona-deploy/deploy/ecosystem.config.js && test -f /tmp/ona-deploy/deploy/set-email-claiming.js && test -f /tmp/ona-deploy/deploy/CAPABILITIES.json && test -f /tmp/ona-deploy/deploy/validate-release-capabilities.js || { echo Refusing rollback to an invalid or capability-incompatible artifact >&2; exit 1; }",
              "printf %s \($validator) | base64 -d > /tmp/ona-trusted-release-validator.js",
              "LIVE_HEALTH_FLAG=; if test -f /opt/service/alb-live-health-required; then LIVE_HEALTH_FLAG=--require-alb-live-health; fi; node /tmp/ona-trusted-release-validator.js /tmp/ona-deploy --database --runtime-api-dir /opt/service/current/api \($capability_flags) $LIVE_HEALTH_FLAG",
              "bash /tmp/ona-deploy/deploy/remote-deploy.sh /tmp/ona-deploy",
              "rm -rf /tmp/ona-deploy /tmp/ona-trusted-release-validator.js"
            ]
          }' > /tmp/ssm-params.json

          wait_target_health() {
            local instance="$1"
            local target_group
            [ "$MODE" = asg ] || return 0
            for target_group in $(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
              --query 'AutoScalingGroups[0].TargetGroupARNs' --output text); do
              aws elbv2 wait target-in-service --target-group-arn "$target_group" --targets "Id=$instance"
            done
          }

          deploy_instance() {
            local instance="$1"
            local command_id status
            command_id=$(aws ssm send-command \
              --instance-ids "$instance" --document-name AWS-RunShellScript \
              --comment "Redeploy API artifact $SHA" --parameters file:///tmp/ssm-params.json \
              --query 'Command.CommandId' --output text)
            echo "SSM command $command_id on $instance"
            while true; do
              status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
                --query Status --output text 2>/dev/null || echo Pending)
              case "$status" in Success|Failed|Cancelled|TimedOut) break ;; *) sleep 5 ;; esac
            done
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
              --query StandardOutputContent --output text
            if [ "$status" != Success ]; then
              echo "Artifact redeploy failed on $instance with status $status; stderr:" >&2
              aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
                --query StandardErrorContent --output text >&2
              return 1
            fi
            wait_target_health "$instance"
          }

          stable_asg_instances() {
            local state desired count total
            for _ in $(seq 1 60); do
              state=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
                --query 'AutoScalingGroups[0].[DesiredCapacity,length(Instances[?LifecycleState==`InService` && HealthStatus==`Healthy`]),length(Instances)]' \
                --output text)
              read -r desired count total <<< "$state"
              if [ "$desired" -gt 0 ] && [ "$count" -eq "$desired" ] && [ "$total" -eq "$desired" ]; then
                aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
                  --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService` && HealthStatus==`Healthy`].InstanceId' \
                  --output text | tr '\t' '\n' | sed '/^$/d' | sort
                return
              fi
              sleep 10
            done
            echo "ASG $ASG_NAME did not reach a stable healthy state" >&2
            return 1
          }

          if [ "$MODE" = singleton ]; then
            deploy_instance "${{ steps.env.outputs.INSTANCE_ID }}"
          else
            declare -A deployed=()
            promoted=false
            for _ in $(seq 1 5); do
              instances_text=$(stable_asg_instances)
              mapfile -t instances <<< "$instances_text"
              for instance in "${instances[@]}"; do
                if [ -z "${deployed[$instance]:-}" ]; then
                  deploy_instance "$instance"
                  deployed[$instance]=1
                  if ! $promoted; then
                    aws s3 cp "s3://$BUCKET/api/$SHA.tar.gz" \
                      "s3://$BUCKET/api/latest-compatible.tar.gz"
                    promoted=true
                  fi
                fi
              done
              current_text=$(stable_asg_instances)
              mapfile -t current <<< "$current_text"
              complete=true
              for instance in "${current[@]}"; do
                [ -n "${deployed[$instance]:-}" ] || complete=false
              done
              if $complete && [ "${instances[*]}" = "${current[*]}" ]; then
                exit 0
              fi
            done
            echo "ASG membership did not stabilize on fully redeployed instances" >&2
            exit 1
          fi

      - name: External API smoke check
        run: |
          if [ "${{ steps.env.outputs.DEPLOYMENT_MODE }}" = asg ]; then
            for target_group in $(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "${{ steps.env.outputs.ASG_NAME }}" \
              --query 'AutoScalingGroups[0].TargetGroupARNs' --output text); do
              UNHEALTHY=$(aws elbv2 describe-target-health --target-group-arn "$target_group" \
                --query 'length(TargetHealthDescriptions[?TargetHealth.State!=`healthy`])' --output text)
              test "$UNHEALTHY" = 0
            done
          else
            curl -fsS "https://${{ steps.env.outputs.API_HOST }}/health" | grep -q '"database":"ok"'
          fi

      - name: Mark artifact as latest
        if: ${{ inputs.mark_latest }}
        run: |
          aws s3 cp \
            "s3://${{ steps.env.outputs.ARTIFACTS_BUCKET }}/api/${{ inputs.artifact_sha }}.tar.gz" \
            "s3://${{ steps.env.outputs.ARTIFACTS_BUCKET }}/api/latest.tar.gz"
          aws s3 cp \
            "s3://${{ steps.env.outputs.ARTIFACTS_BUCKET }}/api/${{ inputs.artifact_sha }}.tar.gz" \
            "s3://${{ steps.env.outputs.ARTIFACTS_BUCKET }}/api/latest-compatible.tar.gz"
