name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        required: true
        type: choice
        options: [staging, prod, prod-secondary]
        default: staging

permissions:
  id-token: write
  contents: read

concurrency:
  # Production infrastructure/config updates serialize with production API
  # releases so deploy cannot read partially updated IAM or runtime config.
  group: ${{ inputs.environment == 'prod' && 'api-release-production' || inputs.environment == 'prod-secondary' && 'api-release-prod-secondary' || 'api-release-staging' }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    # prod and prod-secondary must be protected with required reviewers in GitHub Environments.
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Assert prod-secondary target account
        if: ${{ inputs.environment == 'prod-secondary' }}
        env:
          EXPECTED_ACCOUNT_ID: '710054969994'
          ROLE_ARN: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          PROD_SECONDARY_AMI_ID: ${{ vars.PROD_SECONDARY_AMI_ID }}
        run: |
          set -euo pipefail
          case "$ROLE_ARN" in arn:aws:iam::${EXPECTED_ACCOUNT_ID}:role/*) ;; *) echo 'prod-secondary role belongs to the wrong account' >&2; exit 1;; esac
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT_ID" || { echo 'Refusing apply outside prod-secondary account' >&2; exit 1; }
          test "$AWS_REGION" = us-east-1 || { echo 'prod-secondary region must be us-east-1' >&2; exit 1; }
          [[ "$PROD_SECONDARY_AMI_ID" =~ ^ami-[0-9a-f]{8,17}$ ]] || { echo 'PROD_SECONDARY_AMI_ID must pin the reviewed current image' >&2; exit 1; }
          echo "TF_VAR_ami_id=$PROD_SECONDARY_AMI_ID" >> "$GITHUB_ENV"

      - name: Resolve Terraform environment
        id: env
        run: |
          set -euo pipefail
          case "${{ inputs.environment }}" in
            staging)
              WORKING_DIR=terraform/envs/staging
              WORKSPACE=
              VAR_FILE=staging.tfvars
              ;;
            prod)
              WORKING_DIR=terraform/envs/prod
              WORKSPACE=
              VAR_FILE=
              ;;
            prod-secondary)
              WORKING_DIR=terraform/envs/prod-secondary
              WORKSPACE=
              VAR_FILE=prod-secondary.tfvars
              ;;
            production)
              echo "The old root production workspace is blocked; use prod-v2/prod (terraform/envs/prod)." >&2
              exit 1
              ;;
            *) echo "Unknown environment: ${{ inputs.environment }}" >&2; exit 1 ;;
          esac
          echo "WORKING_DIR=$WORKING_DIR" >> "$GITHUB_OUTPUT"
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "VAR_FILE=$VAR_FILE" >> "$GITHUB_OUTPUT"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Check sensitive variables
        if: ${{ inputs.environment != 'prod-secondary' }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TF_VAR_db_password" ]; then
            echo "TF_VAR_DB_PASSWORD secret is required for Terraform apply." >&2
            exit 1
          fi

      - name: Terraform init
        working-directory: ${{ steps.env.outputs.WORKING_DIR }}
        run: terraform init

      - name: Select workspace
        if: ${{ steps.env.outputs.WORKSPACE != '' }}
        working-directory: ${{ steps.env.outputs.WORKING_DIR }}
        run: terraform workspace select "${{ steps.env.outputs.WORKSPACE }}"

      - name: Terraform validate
        working-directory: ${{ steps.env.outputs.WORKING_DIR }}
        run: terraform validate

      # The helper first reads the current target-group path. It proves every
      # registered host only for the one-time non-/live -> /live migration; once
      # /live is active, recovery applies proceed without host-health coupling.
      - name: Configure prod-secondary deploy preflight credentials
        if: ${{ inputs.environment == 'prod-secondary' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Guard prod-secondary /live migration
        if: ${{ inputs.environment == 'prod-secondary' }}
        env:
          API_ASG_NAME: ${{ vars.API_ASG_NAME }}
        run: |
          set -euo pipefail
          test -n "$API_ASG_NAME" || { echo 'API_ASG_NAME is required for /live migration preflight' >&2; exit 1; }
          scripts/deploy/verify-prod-secondary-live-targets.sh "$API_ASG_NAME"

      - name: Restore prod-secondary Terraform credentials
        if: ${{ inputs.environment == 'prod-secondary' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform plan
        working-directory: ${{ steps.env.outputs.WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          set -euo pipefail
          args=(-input=false -out=tfplan)
          if [ -n "${{ steps.env.outputs.VAR_FILE }}" ]; then
            args+=("-var-file=${{ steps.env.outputs.VAR_FILE }}")
          fi
          terraform plan "${args[@]}"

      - name: Terraform apply
        working-directory: ${{ steps.env.outputs.WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan
