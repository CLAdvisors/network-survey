name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        required: true
        type: choice
        options: [staging, prod, prod-secondary]
        default: staging

permissions:
  id-token: write
  contents: read

concurrency:
  # Production infrastructure/config updates serialize with production API
  # releases so deploy cannot read partially updated IAM or runtime config.
  group: ${{ inputs.environment == 'prod' && 'api-release-production' || inputs.environment == 'prod-secondary' && 'api-release-prod-secondary' || 'api-release-staging' }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    # prod and prod-secondary must be protected with required reviewers in GitHub Environments.
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Assert prod-secondary target account
        if: ${{ inputs.environment == 'prod-secondary' }}
        env:
          EXPECTED_ACCOUNT_ID: '710054969994'
          ROLE_ARN: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          PROD_SECONDARY_AMI_ID: ${{ vars.PROD_SECONDARY_AMI_ID }}
        run: |
          set -euo pipefail
          case "$ROLE_ARN" in arn:aws:iam::${EXPECTED_ACCOUNT_ID}:role/*) ;; *) echo 'prod-secondary role belongs to the wrong account' >&2; exit 1;; esac
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT_ID" || { echo 'Refusing apply outside prod-secondary account' >&2; exit 1; }
          test "$AWS_REGION" = us-east-1 || { echo 'prod-secondary region must be us-east-1' >&2; exit 1; }
          [[ "$PROD_SECONDARY_AMI_ID" =~ ^ami-[0-9a-f]{8,17}$ ]] || { echo 'PROD_SECONDARY_AMI_ID must pin the reviewed current image' >&2; exit 1; }
          echo "TF_VAR_ami_id=$PROD_SECONDARY_AMI_ID" >> "$GITHUB_ENV"

      - name: Resolve Terraform environment
        id: env
        run: |
          set -euo pipefail
          case "${{ inputs.environment }}" in
            staging)
              WORKING_DIR=terraform/envs/staging
              WORKSPACE=
              VAR_FILE=staging.tfvars
              ;;
            prod)
              WORKING_DIR=terraform/envs/prod
              WORKSPACE=
              VAR_FILE=
              ;;
            prod-secondary)
              WORKING_DIR=terraform/envs/prod-secondary
              WORKSPACE=
              VAR_FILE=prod-secondary.tfvars
              ;;
            production)
              echo "The old root production workspace is blocked; use prod-v2/prod (terraform/envs/prod)." >&2
              exit 1
              ;;
            *) echo "Unknown environment: ${{ inputs.environment }}" >&2; exit 1 ;;
          esac
          echo "WORKING_DIR=$WORKING_DIR" >> "$GITHUB_OUTPUT"
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "VAR_FILE=$VAR_FILE" >> "$GITHUB_OUTPUT"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Check sensitive variables
        if: ${{ inputs.environment != 'prod-secondary' }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TF_VAR_db_password" ]; then
            echo "TF_VAR_DB_PASSWORD secret is required for Terraform apply." >&2
            exit 1
          fi

      - name: Terraform init
        working-directory: ${{ steps.env.outputs.WORKING_DIR }}
        run: terraform init

      - name: Select workspace
        if: ${{ steps.env.outputs.WORKSPACE != '' }}
        working-directory: ${{ steps.env.outputs.WORKING_DIR }}
        run: terraform workspace select "${{ steps.env.outputs.WORKSPACE }}"

      - name: Terraform validate
        working-directory: ${{ steps.env.outputs.WORKING_DIR }}
        run: terraform validate

      # Inspect the exact Terraform-state target under the already-authorized
      # Terraform role. This avoids both a mutable ASG-name bypass and the
      # deploy-role DescribeTargetGroups bootstrap cycle.
      - name: Inspect Terraform-managed prod-secondary health path
        id: live-migration
        if: ${{ inputs.environment == 'prod-secondary' }}
        working-directory: ${{ steps.env.outputs.WORKING_DIR }}
        run: |
          set -euo pipefail
          state_value() {
            terraform state show -no-color "$1" | awk -F' = ' -v key="$2" '$1 ~ "^[[:space:]]*" key "$" { gsub(/^\"|\"$/, "", $2); print $2; exit }'
          }
          ASG_NAME=$(state_value 'module.platform.aws_autoscaling_group.app' name)
          TARGET_GROUP_ARN=$(state_value 'module.platform.aws_lb_target_group.api' arn)
          test -n "$ASG_NAME" && test -n "$TARGET_GROUP_ARN" || { echo 'Could not bind /live preflight to Terraform-managed ASG/TG state' >&2; exit 1; }
          CURRENT_PATH=$(aws elbv2 describe-target-groups --target-group-arns "$TARGET_GROUP_ARN" --query 'TargetGroups[0].HealthCheckPath' --output text)
          test -n "$CURRENT_PATH" && test "$CURRENT_PATH" != None || { echo 'Current Terraform-managed target-group path is unknown' >&2; exit 1; }
          echo "asg_name=$ASG_NAME" >> "$GITHUB_OUTPUT"
          echo "target_group_arn=$TARGET_GROUP_ARN" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT_PATH" = /live ]; then
            echo 'migration_required=false' >> "$GITHUB_OUTPUT"
          else
            echo "Migrating Terraform-managed target group from $CURRENT_PATH to /live"
            echo 'migration_required=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Configure prod-secondary deploy preflight credentials
        if: ${{ inputs.environment == 'prod-secondary' && steps.live-migration.outputs.migration_required == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Guard prod-secondary /live migration
        if: ${{ inputs.environment == 'prod-secondary' && steps.live-migration.outputs.migration_required == 'true' }}
        run: scripts/deploy/verify-prod-secondary-live-targets.sh '${{ steps.live-migration.outputs.asg_name }}' '${{ steps.live-migration.outputs.target_group_arn }}'

      - name: Restore prod-secondary Terraform credentials
        if: ${{ inputs.environment == 'prod-secondary' && steps.live-migration.outputs.migration_required == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform plan
        working-directory: ${{ steps.env.outputs.WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          set -euo pipefail
          args=(-input=false -out=tfplan)
          if [ -n "${{ steps.env.outputs.VAR_FILE }}" ]; then
            args+=("-var-file=${{ steps.env.outputs.VAR_FILE }}")
          fi
          terraform plan "${args[@]}"

      - name: Terraform apply
        working-directory: ${{ steps.env.outputs.WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      # Run even after a partial apply failure: if AWS now uses /live, commit
      # the rollback floor before this serialized workflow releases its lock.
      - name: Inspect post-apply /live floor
        id: post-live-floor
        if: ${{ always() && inputs.environment == 'prod-secondary' }}
        run: |
          set -euo pipefail
          PATH_NOW=$(aws elbv2 describe-target-groups --target-group-arns '${{ steps.live-migration.outputs.target_group_arn }}' --query 'TargetGroups[0].HealthCheckPath' --output text)
          if [ "$PATH_NOW" = /live ]; then echo 'required=true' >> "$GITHUB_OUTPUT"; else echo 'required=false' >> "$GITHUB_OUTPUT"; fi

      - name: Configure prod-secondary capability-floor credentials
        if: ${{ always() && inputs.environment == 'prod-secondary' && steps.post-live-floor.outputs.required == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Stamp /live rollback floor on existing hosts
        if: ${{ always() && inputs.environment == 'prod-secondary' && steps.post-live-floor.outputs.required == 'true' }}
        env:
          ASG_NAME: ${{ steps.live-migration.outputs.asg_name }}
        run: |
          set -euo pipefail
          readarray -t INSTANCES < <(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState!=`Terminating`].InstanceId' --output text | tr '\t' '\n' | sed '/^$/d')
          [ "${#INSTANCES[@]}" -gt 0 ] || { echo 'No existing hosts to stamp; new launch-template hosts create the floor marker during bootstrap.'; exit 0; }
          PARAMS=$(jq -cn '{commands:["set -euo pipefail","install -o root -g root -m 0644 /dev/null /opt/service/alb-live-health-required"]}')
          COMMAND_ID=$(aws ssm send-command --instance-ids "${INSTANCES[@]}" --document-name AWS-RunShellScript \
            --comment 'Commit prod-secondary /live rollback capability floor' --parameters "$PARAMS" --query 'Command.CommandId' --output text)
          for instance in "${INSTANCES[@]}"; do
            aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$instance"
            test "$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$instance" --query Status --output text)" = Success
          done
