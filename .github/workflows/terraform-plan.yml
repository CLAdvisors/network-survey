name: Terraform Plan

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-plan.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan
        required: true
        type: choice
        options: [staging, prod, prod-secondary]
        default: staging

permissions:
  id-token: write
  contents: read
  pull-requests: read

concurrency:
  group: terraform-plan-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'prod-secondary' && vars.AWS_TERRAFORM_PLAN_ROLE_ARN || vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Assert target AWS account
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'prod-secondary' }}
        env:
          EXPECTED_ACCOUNT_ID: '710054969994'
          ROLE_ARN: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          PROD_SECONDARY_AMI_ID: ${{ vars.PROD_SECONDARY_AMI_ID }}
        run: |
          set -euo pipefail
          case "$ROLE_ARN" in
            arn:aws:iam::${EXPECTED_ACCOUNT_ID}:role/*) ;;
            *) echo "prod-secondary AWS_TERRAFORM_ROLE_ARN must belong to account $EXPECTED_ACCOUNT_ID" >&2; exit 1 ;;
          esac
          ACTUAL_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          test "$ACTUAL_ACCOUNT_ID" = "$EXPECTED_ACCOUNT_ID" || {
            echo "Refusing prod-secondary plan in AWS account $ACTUAL_ACCOUNT_ID" >&2
            exit 1
          }
          [[ "$PROD_SECONDARY_AMI_ID" =~ ^ami-[0-9a-f]{8,17}$ ]] || { echo 'PROD_SECONDARY_AMI_ID must pin the reviewed current image' >&2; exit 1; }
          echo "TF_VAR_ami_id=$PROD_SECONDARY_AMI_ID" >> "$GITHUB_ENV"

      - name: Resolve Terraform environment
        id: env
        run: |
          set -euo pipefail
          GH_ENV="${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}"
          case "$GH_ENV" in
            staging)
              WORKING_DIR=terraform/envs/staging
              WORKSPACE=
              VAR_FILE=staging.tfvars
              ;;
            prod)
              WORKING_DIR=terraform/envs/prod
              WORKSPACE=
              VAR_FILE=
              ;;
            prod-secondary)
              WORKING_DIR=terraform/envs/prod-secondary
              WORKSPACE=
              VAR_FILE=prod-secondary.tfvars
              ;;
            production)
              echo "The old root production workspace is blocked; use prod-v2/prod (terraform/envs/prod)." >&2
              exit 1
              ;;
            *) echo "Unknown environment: $GH_ENV" >&2; exit 1 ;;
          esac
          echo "WORKING_DIR=$WORKING_DIR" >> "$GITHUB_OUTPUT"
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "VAR_FILE=$VAR_FILE" >> "$GITHUB_OUTPUT"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Check source-environment sensitive variables
        id: source-secrets
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.environment != 'prod-secondary' }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TF_VAR_db_password" ]; then
            echo "TF_VAR_DB_PASSWORD secret is unavailable; init/validate will run, plan will be skipped." >&2
            echo "can_plan=false" >> "$GITHUB_OUTPUT"
          else
            echo "can_plan=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform init
        working-directory: ${{ steps.env.outputs.WORKING_DIR }}
        run: terraform init

      - name: Select workspace
        if: ${{ steps.env.outputs.WORKSPACE != '' }}
        working-directory: ${{ steps.env.outputs.WORKING_DIR }}
        run: terraform workspace select "${{ steps.env.outputs.WORKSPACE }}"

      - name: Terraform validate
        working-directory: ${{ steps.env.outputs.WORKING_DIR }}
        run: terraform validate

      - name: Terraform plan (source environments)
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.environment != 'prod-secondary') && steps.source-secrets.outputs.can_plan == 'true' }}
        working-directory: ${{ steps.env.outputs.WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          set -euo pipefail
          args=(-input=false)
          if [ -n "${{ steps.env.outputs.VAR_FILE }}" ]; then
            args+=("-var-file=${{ steps.env.outputs.VAR_FILE }}")
          fi
          terraform plan "${args[@]}"

      - name: Terraform plan (prod-secondary, no source secrets)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'prod-secondary' }}
        working-directory: ${{ steps.env.outputs.WORKING_DIR }}
        run: terraform plan -input=false -var-file=prod-secondary.tfvars
